    <script>
      // Tema: kayıtlı tercih yoksa sistem ayarı. Depolama kapalıysa sessizce sistem ayarına düşer.
      (function () {
        var t = null;
        try { t = localStorage.getItem("kokpit-theme"); } catch (e) {}
        if (t === "light" || t === "dark") {
          document.documentElement.setAttribute("data-theme", t);
          // Durum çubuğu rengi de seçilen temaya uysun
          var ms = document.querySelectorAll('meta[name="theme-color"]');
          for (var i = 0; i < ms.length; i++) ms[i].setAttribute("content", t === "dark" ? "#0b0f17" : "#f3f5f9");
        }
      })();
